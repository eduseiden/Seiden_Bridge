name: "Seiden Bridge"
version: "0.7.0"
slug: "seiden_bridge"
description: "Camada de integração do Seiden One — Connector Foundation"
url: "https://github.com/eduseiden/Seiden-HA"
startup: services
boot: auto
init: false
arch: [amd64, aarch64]
host_network: true
hassio_api: true
homeassistant_api: true
map:
  - config:rw
hassio_role: default
options:
  poll_interval: 2
  request_timeout: 5
  max_retry_interval: 300
  log_level: "INFO"
  publish_last_photo: true
  photo_max_size_mb: 5
  ha_event: "seiden_presence"
  reader_offline_event: "seiden_reader_offline"
  reader_online_event: "seiden_reader_online"
  connections:
    - id: "evo_principal"
      name: "Entrada Principal"
      connector: "evo"
      enabled: true
      password: "1234"
      endpoint:
        host: "192.168.4.157"
        scheme: "http"
        path: "/api"
      context:
        interaction_type: "passage"
        direction: "in"
schema:
  poll_interval: int
  request_timeout: int
  max_retry_interval: int
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  publish_last_photo: bool
  photo_max_size_mb: int
  ha_event: str
  reader_offline_event: str
  reader_online_event: str
  connections:
    - id: str
      name: str
      connector: list(evo|control_id|hikvision|intelbras)
      enabled: bool
      password: password
      endpoint:
        host: str
        scheme: list(http|https)
        path: str
      context:
        interaction_type: list(passage|authorization|authentication|attendance|presence|unlock)
        direction: list(in|out|none)
