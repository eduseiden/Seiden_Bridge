name: Seiden Bridge
version: 0.15.2.1
slug: seiden_bridge
description: Camada de integração do Seiden One — captura, normalização e publicação de eventos canônicos
url: https://github.com/eduseiden/Seiden_Bridge
startup: services
boot: auto
init: false
arch:
- amd64
- aarch64
host_network: true
hassio_api: true
homeassistant_api: true
map:
- config:rw
hassio_role: default
options:
  poll_interval: 2
  request_timeout: 5
  max_retry_interval: 300
  log_level: INFO
  publish_last_photo: true
  photo_max_size_mb: 5
  reset_occupancy_state_on_start: false
  bridge_event: seiden_bridge_event
  connection_offline_event: seiden_connection_offline
  connection_online_event: seiden_connection_online
  connections:
  - id: evo_principal
    name: Entrada Principal
    connector: evo
    enabled: true
    password: '1234'
    endpoint:
      host: 192.168.4.157
      scheme: http
      path: /api
    context:
      interaction_type: passage
      direction: in
  mqtt_connections: []
  environment_sources: []
  operation_timezone: America/Sao_Paulo
  evo_relay_connections: []
schema:
  poll_interval: int
  request_timeout: int
  max_retry_interval: int
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  publish_last_photo: bool
  photo_max_size_mb: int
  reset_occupancy_state_on_start: bool
  bridge_event: str
  connection_offline_event: str
  connection_online_event: str
  connections:
  - id: str
    name: str
    connector: list(evo|control_id|hikvision|intelbras)
    enabled: bool
    password: password
    endpoint:
      host: str
      scheme: list(http|https)
      path: str
    context:
      interaction_type: list(passage|authorization|authentication|attendance|presence|unlock)
      direction: list(in|out|none)
  mqtt_connections:
  - id: str
    name: str
    enabled: bool?
    host: str
    port: port?
    username: str?
    password: password?
    client_id: str?
    clean_session: bool?
    keepalive: int?
    qos: int(0,2)?
    event_type: str?
    state_driver_enabled: bool?
    state_driver_topics: str?
    state_driver_field_prefix: str?
    state_driver_publish_raw: bool?
    topics:
    - str
    tls_enabled: bool?
    tls_verify: bool?
    ca_cert: str?
    client_cert: str?
    client_key: str?
  environment_sources:
  - id: str
    name: str
    enabled: bool?
    connection_id: str
    topic: str
    qos: int(0,2)?
    description: str?
    location_id: str?
    location_name: str?
    asset_id: str?
    asset_name: str?
    profile_id: str?
    fields:
      temperature_c: str?
      humidity_pct: str?
      battery_pct: str?
  operation_timezone: str
  evo_relay_connections:
  - id: str
    name: str
    enabled: bool?
    listen_host: str?
    listen_port: port?
    host: str
    port: port?
    scheme: list(ws|wss)?
    path: str?
    devices:
    - id: str?
      serial_number: str
      name: str
      enabled: bool?
      customer_id: str?
      site_id: str?
      direction: list(in|out|none)
  ha_state_driver_enabled: bool?
  ha_state_driver_entities: str?
  ha_state_driver_ignore_states: str?
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: Seiden Bridge
panel_admin: true
