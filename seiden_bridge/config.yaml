name: Seiden Bridge
version: 0.10.0.1
slug: seiden_bridge
description: Camada de integração do Seiden One — captura, normalização e publicação
  de eventos canônicos
url: https://github.com/eduseiden/Seiden-HA
startup: services
boot: auto
init: false
arch:
- amd64
- aarch64
host_network: true
hassio_api: true
homeassistant_api: true
map:
- config:rw
hassio_role: default
options:
  poll_interval: 2
  request_timeout: 5
  max_retry_interval: 300
  log_level: INFO
  publish_last_photo: true
  photo_max_size_mb: 5
  bridge_event: seiden_bridge_event
  connection_offline_event: seiden_connection_offline
  connection_online_event: seiden_connection_online
  connections:
  - id: evo_principal
    name: Entrada Principal
    connector: evo
    enabled: true
    password: '1234'
    endpoint:
      host: 192.168.4.157
      scheme: http
      path: /api
    context:
      interaction_type: passage
      direction: in
  mqtt_connections: []
  operation_timezone: America/Sao_Paulo
schema:
  poll_interval: int
  request_timeout: int
  max_retry_interval: int
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  publish_last_photo: bool
  photo_max_size_mb: int
  bridge_event: str
  connection_offline_event: str
  connection_online_event: str
  connections:
  - id: str
    name: str
    connector: list(evo|control_id|hikvision|intelbras)
    enabled: bool
    password: password
    endpoint:
      host: str
      scheme: list(http|https)
      path: str
    context:
      interaction_type: list(passage|authorization|authentication|attendance|presence|unlock)
      direction: list(in|out|none)
  mqtt_connections:
  - id: str
    name: str
    enabled: bool?
    host: str
    port: port?
    username: str?
    password: password?
    client_id: str?
    clean_session: bool?
    keepalive: int?
    qos: int(0,2)?
    event_type: str?
    topics:
    - str
    tls_enabled: bool?
    tls_verify: bool?
    ca_cert: str?
    client_cert: str?
    client_key: str?
  operation_timezone: str
